<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 380" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 天空与朝阳主渐变 -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b0000"/>
      <stop offset="25%" stop-color="#b71c1c"/>
      <stop offset="60%" stop-color="#d32f2f"/>
      <stop offset="85%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>

    <!-- 金色光芒辐射渐变 -->
    <radialGradient id="sunGlow" cx="20%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#ffe082" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ffb300" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#b71c1c" stop-opacity="0"/>
    </radialGradient>

    <!-- 红绸缎渐变1 -->
    <linearGradient id="ribbon1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#800000" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#d32f2f" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#f44336" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffc107" stop-opacity="0.8"/>
    </linearGradient>

    <!-- 红绸缎渐变2 -->
    <linearGradient id="ribbon2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5c0000" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#c62828" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0.9"/>
    </linearGradient>

    <!-- 金边高光 -->
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>

    <!-- 远山群山渐变 -->
    <linearGradient id="mountainFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d32f2f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5c0000" stop-opacity="0.8"/>
    </linearGradient>

    <!-- 近景长城与山峦渐变 -->
    <linearGradient id="greatWallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffa000" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#b71c1c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4a0000" stop-opacity="0.95"/>
    </linearGradient>

    <!-- 祥云滤镜 -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. 背景主色调 -->
  <rect width="100%" height="100%" fill="url(#skyGrad)"/>

  <!-- 2. 朝阳金色辐射光辉 -->
  <rect width="100%" height="100%" fill="url(#sunGlow)"/>

  <!-- 3. 朝阳光芒射线 -->
  <g opacity="0.18">
    <polygon points="384,114 0,0 0,60" fill="#fff9c4"/>
    <polygon points="384,114 0,140 0,220" fill="#fff9c4"/>
    <polygon points="384,114 200,380 320,380" fill="#fff9c4"/>
    <polygon points="384,114 550,380 700,380" fill="#fff9c4"/>
    <polygon points="384,114 1100,0 1250,0" fill="#fff9c4"/>
    <polygon points="384,114 1600,0 1800,0" fill="#fff9c4"/>
    <polygon points="384,114 1920,120 1920,200" fill="#fff9c4"/>
    <polygon points="384,114 1920,300 1920,380" fill="#fff9c4"/>
  </g>

  <!-- 4. 远景重峦叠嶂群山轮廓 -->
  <path d="M0,280 Q250,210 500,260 T1000,220 T1500,250 T1920,210 L1920,380 L0,380 Z" fill="url(#mountainFar)"/>
  <path d="M0,300 Q300,250 650,290 T1300,260 T1920,270 L1920,380 L0,380 Z" fill="#7a0000" opacity="0.5"/>

  <!-- 5. 雄伟万里长城垛口与烽火台金红轮廓 -->
  <g fill="url(#greatWallGrad)" opacity="0.88">
    <!-- 长城走势与垛口 -->
    <path d="M750,380 L750,290 L770,290 L770,295 L785,295 L785,290 L800,290 L800,295 L815,295 L815,290 L830,290 L840,305 
             L950,280 L950,275 L965,275 L965,270 L980,270 L980,275 L995,275 L995,270 L1010,270 L1025,285
             L1120,260 L1120,250 L1140,250 L1140,240 L1180,240 L1180,250 L1200,250 L1200,265
             L1350,235 L1350,225 L1370,225 L1370,220 L1385,220 L1385,225 L1400,225 L1400,220 L1415,220 L1415,225 L1430,225 L1440,240
             L1550,220 L1550,205 L1570,205 L1570,195 L1620,195 L1620,205 L1640,205 L1650,230
             L1800,210 L1800,200 L1820,200 L1820,195 L1835,195 L1835,200 L1850,200 L1850,195 L1865,195 L1865,200 L1880,200 L1920,230 
             L1920,380 Z"/>
    <!-- 烽火台楼阁细节 -->
    <rect x="1150" y="225" width="20" height="15" rx="2" fill="#ffd54f" opacity="0.6"/>
    <rect x="1580" y="180" width="22" height="15" rx="2" fill="#ffd54f" opacity="0.7"/>
  </g>

  <!-- 6. 雄壮飘扬的红色绸缎与金色包边（主视觉气势） -->
  <!-- 底层深红绸带 -->
  <path d="M-100,200 C300,100 600,340 1050,180 C1400,50 1700,280 2050,140 L2050,240 C1700,380 1400,150 1050,280 C600,440 300,200 -100,300 Z" fill="url(#ribbon2)" opacity="0.85"/>

  <!-- 顶层主红绸带 -->
  <path d="M-50,260 C350,140 700,360 1150,210 C1500,90 1750,290 2000,190 L2000,230 C1750,330 1500,130 1150,250 C700,400 350,180 -50,300 Z" fill="url(#ribbon1)"/>

  <!-- 绸缎金边勾线 -->
  <path d="M-50,260 C350,140 700,360 1150,210 C1500,90 1750,290 2000,190" fill="none" stroke="url(#goldEdge)" stroke-width="4" opacity="0.9"/>
  <path d="M-50,300 C350,180 700,400 1150,250 C1500,130 1750,330 2000,230" fill="none" stroke="url(#goldEdge)" stroke-width="3" opacity="0.75"/>

  <!-- 7. 左侧庄严中华华表立体轮廓与金顶 (Huabiao Column Silhouette) -->
  <g opacity="0.35" transform="translate(60, 40) scale(0.65)">
    <!-- 华表承露盘与顶兽 -->
    <ellipse cx="200" cy="50" rx="35" ry="8" fill="#fff9c4"/>
    <path d="M190,45 Q200,20 210,45 Z" fill="#ffd54f"/>
    <!-- 云板横插 -->
    <path d="M130,90 Q200,60 270,90 Q290,95 280,105 Q200,85 120,105 Q110,95 130,90 Z" fill="#ffe082"/>
    <!-- 柱身与盘龙纹理线 -->
    <rect x="180" y="55" width="40" height="380" fill="#ffe082"/>
    <line x1="180" y1="120" x2="220" y2="150" stroke="#b71c1c" stroke-width="3" opacity="0.5"/>
    <line x1="180" y1="180" x2="220" y2="210" stroke="#b71c1c" stroke-width="3" opacity="0.5"/>
    <line x1="180" y1="240" x2="220" y2="270" stroke="#b71c1c" stroke-width="3" opacity="0.5"/>
    <line x1="180" y1="300" x2="220" y2="330" stroke="#b71c1c" stroke-width="3" opacity="0.5"/>
    <!-- 柱础八角底座 -->
    <polygon points="160,435 240,435 250,460 150,460" fill="#ffca28"/>
    <polygon points="140,460 260,460 270,490 130,490" fill="#ffa000"/>
  </g>

  <!-- 8. 传统吉祥如意祥云纹饰 (Auspicious Clouds) -->
  <g fill="#fff" opacity="0.22" filter="url(#softGlow)">
    <!-- 祥云团 1 -->
    <path d="M1650,80 C1670,60 1710,60 1730,80 C1750,70 1790,80 1800,110 C1820,120 1820,150 1800,170 C1780,190 1640,190 1620,160 C1600,130 1620,100 1650,80 Z"/>
    <!-- 祥云团 2 -->
    <path d="M220,160 C240,140 270,140 285,155 C300,145 330,155 335,175 C350,185 350,210 335,220 C320,235 210,235 195,215 C180,195 195,175 220,160 Z"/>
  </g>

  <!-- 9. 底部水墨山水淡雅渐变过渡 -->
  <rect y="320" width="100%" height="60" fill="url(#skyGrad)" opacity="0.4"/>
</svg>
