  <path d="M300,500 L300,410 L315,410 L315,418 L330,418 L330,410 L345,410 L345,418 L360,418 L360,410 L375,410 L390,430 
           L480,395 L480,388 L495,388 L495,380 L515,380 L515,388 L530,388 L530,380 L545,380 L560,400
           L640,375 L640,360 L660,360 L660,348 L695,348 L695,360 L715,360 L715,380 L800,400 L800,500 Z" fill="#c62828"/>
  
  <!-- 腾飞红绸金边飞带 -->
