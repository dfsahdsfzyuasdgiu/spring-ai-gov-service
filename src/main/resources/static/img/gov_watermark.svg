    <ellipse cx="33" cy="20" rx="9" ry="5" fill="#b71c1c"/>
  </g>

  <!-- 祥云纹样 -->
  <g transform="translate(560, 60)" fill="#b71c1c">
    <circle cx="30" cy="30" r="16"/>
    <circle cx="50" cy="24" r="20"/>
    <circle cx="75" cy="28" r="15"/>
    <path d="M14,36 Q30,52 65,50 Q85,48 95,36 L14,36 Z"/>
