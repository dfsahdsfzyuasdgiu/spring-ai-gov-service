server.port=8080
spring.application.name=spring-ai-alibaba

# 字符编码强制为 UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# 阿里云百炼 API Key (sk-...)
spring.ai.dashscope.api-key=sk-ws-H.PMEHYED.6qOk.MEUCIQDKzLfo549jPmNHCUB_Bd1ykl_wT8xpqEwzpZVp5fe_MQIgGUK9d6H6RSlDh1bpTRKFXLhoKzA1YB5z7_jVSjWL6SE

# 通义万象文生图模型配置
spring.ai.dashscope.image.options.model=wanx-v1

# 关系数据库持久化配置 (H2 嵌入式文件持久化模式，兼容 MySQL 语法，重启不丢失)
spring.datasource.url=jdbc:h2:file:./data/gz_gov_ai;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# 数据库 DDL 与真实政策办事数据自动初始化
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# 异常与全局错误响应安全策略 (杜绝 Whitelabel 白页与堆栈泄露)
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=always


